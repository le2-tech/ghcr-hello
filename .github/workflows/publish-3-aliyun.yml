name: Build & Push Docker image (Aliyun ACR, hosted runners, temp-tags manifest)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # 按你的地域改，比如 registry.cn-shanghai.aliyuncs.com
  REGISTRY: registry.cn-chengdu.aliyuncs.com
  # 这里默认用 <owner>/<repo> 作为 ACR namespace/repo
  # 确保在 ACR 中也创建了同名 namespace 和 repo
  IMAGE_NAME: ${{ github.repository }}

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 如需默认分支同时打 latest，取消下一行注释
            type=raw,value=latest,enable={{is_default_branch}}

  build:
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - short: amd64
            os: ubuntu-latest
            # platform: linux/amd64
          - short: arm64
            os: [self-hosted, macOS, ARM64]
            # platform: linux/arm64
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with: { install: true }

      - name: Login to Aliyun ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build & push (native ${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }} # 原生构建，无 QEMU
          push: ${{ github.event_name != 'pull_request' }}
          # 临时标签，用于后续合成 manifest
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.short }}
          labels: ${{ needs.meta.outputs.labels }}
          # 官方 runner 用 gha 缓存即可
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

  manifest:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    steps:
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Create & push multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          set -Eeuxo pipefail

          # 直接把 metadata 的“完整引用”作为 --tag 传入；去掉空行与首尾空白
          TAG_ARGS=""
          while IFS= read -r tag; do
            tag="$(echo "$tag" | xargs)"    # trim
            [ -z "$tag" ] && continue
            TAG_ARGS="$TAG_ARGS --tag $tag"
          done <<< "$TAGS"

          # 合成多架构 manifest（使用两个临时标签作为来源）
          docker buildx imagetools create \
            $TAG_ARGS \
            "$IMAGE:${GITHUB_SHA}-amd64" \
            "$IMAGE:${GITHUB_SHA}-arm64"
