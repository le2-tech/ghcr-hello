name: Publish image to GHCR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3 # ① 启用跨架构仿真
      - uses: docker/setup-buildx-action@v3 # ② 启用 buildx
      - uses: docker/login-action@v3 # ③ 登录 GHCR
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6 # ④ 构建并推送多架构镜像
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64 # ★ 关键：指定两种架构
          tags: |
            ghcr.io/${{ github.repository_owner }}/ghcr-hello:latest
            ghcr.io/${{ github.repository_owner }}/ghcr-hello:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
