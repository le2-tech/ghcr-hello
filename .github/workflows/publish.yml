name: Publish image to GHCR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: docker/setup-qemu-action@main
      - uses: docker/setup-buildx-action@main
      - uses: docker/login-action@main
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@main
        with:
          context: .
          file: ./docker-alpine/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/ghcr-hello:latest
            ghcr.io/${{ github.repository_owner }}/ghcr-hello:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
