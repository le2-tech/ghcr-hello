name: Publish image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Image name (e.g. coolcry/test)"
        required: true
        type: string
        default: "coolcry/test"

env:
  IMAGE_NAME: ${{ github.event.inputs.image_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-22.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@main
      - uses: docker/setup-buildx-action@main
      - uses: docker/login-action@main
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@main
        with:
          context: .
          file: ./docker-alpine/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: docker/setup-buildx-action@main
      - uses: docker/login-action@main
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and push manifest list
        run: |
          docker buildx imagetools create \
            -t $IMAGE_NAME:${{ github.sha }} \
            $IMAGE_NAME:${{ github.sha }}-amd64 \
            $IMAGE_NAME:${{ github.sha }}-arm64
          docker buildx imagetools create \
            -t $IMAGE_NAME:latest \
            $IMAGE_NAME:${{ github.sha }}
